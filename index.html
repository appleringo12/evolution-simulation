function hslToHex(h, s, l) {

}

 if((c.diet==="carnivore"||c.diet==="scavenger")&&canEatCorpse(c)){
  const nearbyCorpses = getNearby(gridCorpses, c.x, c.y, effVision);
  for(const k of nearbyCorpses){
   if(k.meat<=.5)continue;
   if(c.diet==="carnivore" && !((k.diet === c.carnDietPref && k.biome === c.carnBiomePref) || (k.diet === "scavenger" && env.eatScavCorpse))) continue;
   const d=(k.x-c.x)**2+(k.y-c.y)**2;if(d<cd){cd=d;cp=k}
  }
 }
 if(cp&&(!prey||cd<pd)){c.mode=6;c.tgt=cp;c.huntTimer=0;return}
 if(prey&&(!fr||pd<fd)){c.mode=2;c.tgt=prey;c.huntTimer=0;return}
 if(fr){c.mode=3;c.tgt=fr;c.huntTimer=0;return}
 if(c.diet==="herbivore"&&canEat(c)){const gi=findGrass(c,effVision);if(gi>=0){c.mode=5;c.gi=gi;c.tgt=null;c.huntTimer=0;return}}
 c.mode=0;c.tgt=null;c.huntTimer=0;
}

function updateCreature(c,dt,born){
 const s=c.s;
 if(c.size < s.size){
  c.size = Math.min(s.size, c.size + s.size * env.growthRate * (dt / DAY));
  updateCache(c); 
 }
 const mx=maxH(c);c.age+=dt;c.atk-=dt;c.cdT-=dt;c.stun-=dt;c.lunge-=dt;
 if(c.huntCd>0)c.huntCd=Math.max(0,c.huntCd-dt);
 let foodNutrition=0;
 if(c.age>=lifespanDays(c)*DAY){c.dead=true;c.leaveCorpse=(c.size>=c.s.size*0.99);return}
 if(c.hun<=0){c.dead=true;c.leaveCorpse=(c.size>=c.s.size*0.99);return}
 
 c.hidden = false;
 c.yielding = false;
 if (env.enablePersonality && c.personality === "sharing" && (c.diet === "carnivore" || c.diet === "scavenger") && (c.hun > mx * 0.2)) {
   let hasHungryOther = false;
   const members = herdMembers.get(c.h.id) || [];
   for(const m of members) {
     if (m !== c && m.hun <= maxH(m) * 0.2) {
       hasHungryOther = true; break;
     }
   }
   if (hasHungryOther) c.yielding = true;
 }

 c.tk-=dt;if(c.tk<=0){c.tk=0.5+rnd()*0.5;think(c)} 
 let want=c.ang,sp=s.speed*.5,t=c.tgt;
 c.fullReturnT=Math.max(0,(c.fullReturnT||0)-dt);

 let refX = c.h.cx, refY = c.h.cy;
 const isSocial = env.enablePersonality && (c.personality === "social" || c.personality === "sharing");
 if (isSocial && !c.isLeader && c.h.leader && !c.h.leader.dead) {
  refX = c.h.leader.x;
  refY = c.h.leader.y;
 }
 
 const distToRef = Math.hypot(refX - c.x, refY - c.y);
 if (isSocial && !c.isLeader) {
  if (distToRef > c.h.rad && c.fullReturnT <= 0) c.fullReturnT = 5;
 } else {
  if(c.hun >= mx-1e-7 && distToRef > c.h.rad && c.fullReturnT <= 0) c.fullReturnT = 5;
 }

 if(c.mode===1){
  if(!t||t.dead)c.mode=0;
  else{ want=Math.atan2(c.y-t.y,c.x-t.x);sp=s.speed; }
 }
 else if(c.mode===2){
  if(c.hun>mx*0.5){c.mode=0;c.tgt=null;c.huntTimer=0;c.tk=0}
  else {
  c.huntTimer+=dt;
  if(!t||t.dead||c.huntTimer>4.0){

   if (c.yielding) {

     if (dToT < c.size + t.size + 15) {
       want += (rnd() - 0.5) * 2; 
       sp = huntSpeed(c) * 0.5;
     }
   } else if(c.atk<=0&&!isTargetClaimed(t,2,c)&&Math.hypot(t.x-c.x,t.y-c.y)<c.size+t.size){
    const successRate = env.huntSuccess / 100;
    if(rnd()<successRate){
     c.atk=1.5;c.stun=1.0;c.lunge=.25;c.la=Math.atan2(t.y-c.y,t.x-c.x);c.hun-=.03*mx;
     t.dead=true;
     hitFx(t,true);
     if (env.huntLeaveCorpse) {
       t.leaveCorpse = true;
     } else {
       foodNutrition+=preyNut(t);
     }
     c.huntCd=env.huntCd||0;
     c.h.huntCd=env.huntHerdCd||0;
    }else{
     c.atk=2.0;c.stun=1.5;c.hun-=.05*mx;
     t.lunge=.35;t.la=Math.atan2(t.y-c.y,t.x-c.x);
     counterFx(c.x,c.y);
    }
    c.huntTimer=0;
   }
  }
  }
 }
 else if(c.mode===3){
  if(!t||t.life<=0||!canEat(c)){c.mode=0;c.tgt=null;c.tk=0}
  else{
   want=Math.atan2(t.y-c.y,t.x-c.x);sp=s.speed;
   if(env.enablePersonality && c.personality==="sharing" && c.h.hasHungryMember){
    if(Math.hypot(t.x-c.x,t.y-c.y)<c.size+12)sp=s.speed*0.5;
   } else if(t.life>0&&!isTargetClaimed(t,3,c)&&Math.hypot(t.x-c.x,t.y-c.y)<c.size+3){
    t.life=0;foodNutrition+=fruitNut(t.b);
   }
  }
 }
 else if(c.mode===5){
  const gi=c.gi;
  if(gi<0||grass[gi]<.3||!canEat(c)){c.mode=0;c.gi=-1;c.tk=0}
  else{
   want=Math.atan2((Math.floor(gi/GW)+.5)*CELL-c.y,(gi%GW+.5)*CELL-c.x);sp=s.speed;
   const ci=clamp(c.y/CELL|0,0,GH-1)*GW+clamp(c.x/CELL|0,0,GW-1);
   if(ci===gi){
    sp=s.speed*.12;
    const biteRate=env.grassEat*GRASS_EAT*Math.pow(c.size/REF_SIZE,1.5)*dt;
    const gNut=env.grassNut*GRASS_NUT*grassBiomeFactor(biome[gi]);
    const bite=Math.min(grass[gi],biteRate,Math.max(0,(mx-c.hun)/gNut));
    grass[gi]-=bite;foodNutrition+=bite*gNut;
   }
  }
 }
 else if(c.mode===6){
  const matchCorpse = t && (c.diet === "scavenger" || (c.diet === "carnivore" && ((t.diet === c.carnDietPref && t.biome === c.carnBiomePref) || (t.diet === "scavenger" && env.eatScavCorpse))));
  if(!t||!matchCorpse||t.meat<=.05||t.life<=0||!canEatCorpse(c)){c.mode=0;c.tgt=null;c.tk=0}
  else{
   want=Math.atan2(t.y-c.y,t.x-c.x);sp=s.speed;
   const cr=t.size*Math.max(.2,Math.sqrt(t.meat/t.meat0));
   if (c.yielding) {
     const dToT = Math.hypot(t.x-c.x, t.y-c.y);
     if (dToT < c.size + cr + 15) {
       want += (rnd() - 0.5) * 2;
       sp = s.speed * 0.5;
     }
   } else if(Math.hypot(t.x-c.x,t.y-c.y)<c.size+cr+2){
    sp=s.speed*.1;
    const bite=Math.min(t.meat,env.corpseEat*CORPSE_EAT*Math.pow(c.size/REF_SIZE,1.5)*dt);
    t.meat-=bite;foodNutrition+=bite;
   }
  }
 }
 if(c.mode===4){
  if(!t||t.dead||t.cdT>0||c.cdT>0||t.hun<t.h.birthAt*maxH(t)||c.hun<c.h.birthAt*mx||herdCountInRange(c.h)>=env.herdCap)c.mode=0;
  else{
   want=Math.atan2(t.y-c.y,t.x-c.x);sp=s.speed*.8;
   if(Math.hypot(t.x-c.x,t.y-c.y)<c.size+t.size+4&&herdCountInRange(c.h,born)<env.herdCap)mate(c,t,born);
  }
 }

 if(c.fullReturnT>0){
  const herdDx=refX-c.x,herdDy=refY-c.y;
  const herdDist=Math.hypot(herdDx,herdDy);
  if(herdDist>c.h.rad){
   if(c.mode!==4){
    c.mode=0;c.tgt=null;c.gi=-1;
    want=Math.atan2(herdDy,herdDx);c.wa=want;
    sp=s.speed;
   }
  }else{
   c.fullReturnT=0;
  }
 }

 if(c.mode===0){
  c.wa+=(rnd()-.5)*dt*3;want=c.wa;const dx=refX-c.x,dy=refY-c.y;
  const dd=Math.hypot(dx,dy),R=c.h.rad;
  if(c.hun>=c.h.hungry*mx){
   if(dd>R){want=Math.atan2(dy,dx);c.wa=want}
  }else{
   if(dd<R){const o=Math.atan2(-dy,-dx);c.wa+=Math.atan2(Math.sin(o-c.wa),Math.cos(o-c.wa))*dt*.8}
   want=c.wa;sp=s.speed*.7;
   
   if(c.diet==="frugivore"){
    const pr=Array.isArray(c.fruitPref)?c.fruitPref:(Array.isArray(c.h.fruitPref)?c.h.fruitPref:[3]);
    const cb=cellAt(c.x,c.y),nb=cellAt(c.x+Math.cos(want)*25,c.y+Math.sin(want)*25);
    if(pr.includes(cb)&&!pr.includes(nb)){c.wa+=Math.PI+(rnd()-.5);want=c.wa}
    else if(!pr.includes(cb) && dd>R){want=Math.atan2(dy,dx);c.wa=want}
   }
   if(c.diet==="herbivore"){
    const gp=GRASS_BIOMES.includes(c.grassPref)?c.grassPref:2;
    const cb=cellAt(c.x,c.y),nb=cellAt(c.x+Math.cos(want)*25,c.y+Math.sin(want)*25);
    if(cb===gp&&nb!==gp){c.wa+=Math.PI+(rnd()-.5);want=c.wa}
    else if(cb!==gp&&dd>R){want=Math.atan2(dy,dx);c.wa=want}
   }
  }
 }
 
 const curB=cellAt(c.x,c.y);
 if(curB===3 && c.size>4){
  const forestDrag = 1 - clamp((c.size - 4) * 0.05, 0, 0.45);
  sp *= forestDrag;
 }

 sp*=env.spd;
 if(c.stun>0)sp=0;
 if(c.fullReturnT>0){
  const dx=refX-c.x,dy=refY-c.y;
  if(Math.hypot(dx,dy)>c.h.rad){want=Math.atan2(dy,dx);sp=s.speed*env.spd;}
  else c.fullReturnT=0;
 }

 const currentSpeedRatio = sp / REF_SPEED;
 const energyBMR = env.metabBase * c._bmrM;
 const energyMove = env.moveCost * c._moveM * Math.pow(currentSpeedRatio, env.moveSpeedExp);
 const energySense = env.senseCost * Math.pow(s.vision / 100, 2);
 const baseConsumption = energyBMR + energyMove + energySense;
 const childMultiplier = (c.size < c.s.size * 0.999) ? env.childHmul : 1;
 c.hun -= baseConsumption * dt * env.metab * c.h.hmul * childMultiplier;
 if(foodNutrition>0)c.hun=Math.min(mx,c.hun+foodNutrition);
 if(c.hun<=0){c.dead=true;c.leaveCorpse=(c.size>=c.s.size*0.99);return}

 let d=want-c.ang;d=Math.atan2(Math.sin(d),Math.cos(d));
 const turnSpd = clamp(26 / c.size, 1.8, 14);
 c.ang += d * Math.min(1, dt * turnSpd);

 const nx=c.x+Math.cos(c.ang)*sp*dt,ny=c.y+Math.sin(c.ang)*sp*dt;
 const b=(nx<0||ny<0||nx>=WW||ny>=WH)?0:cellAt(nx,ny);
 if(b===0){c.wa=c.ang+Math.PI+(rnd()-.5);c.ang=c.wa}
 else{const k=b===1?.6:1;c.x+=(nx-c.x)*k;c.y+=(ny-c.y)*k}
}

let buddingAcc = 0;
function checkBudding(dt){
 if(!env.budding) return;
 buddingAcc += dt;
 if(buddingAcc < DAY) return;
 buddingAcc -= DAY;
 for(const h of herds.slice()){
  const members = pop.filter(c => !c.dead && c.h === h);
  if(members.length >= 4){
   const leaveCount = Math.max(2, Math.floor(members.length * 0.1));
   if(members.length > leaveCount){
    if(rnd() < env.buddingRate) disperseHerd(h, members, leaveCount);
   }
  }
 }
}

function findFoodCenter(member, startX, startY, searchRadius){
 const maxNear = Math.max(200, searchRadius * 1.5);
 let points = [];
 let foodScore;

 if(member.diet === "frugivore"){
  const prefs = Array.isArray(member.fruitPref) && member.fruitPref.length ? member.fruitPref : [3];
  const preferredFruits = fruits.filter(f => prefs.includes(f.b));
  if(preferredFruits.length){
   points = preferredFruits.map(f => ({x:f.x, y:f.y}));
   foodScore = (x,y) => {
    let n = 0;
    for(const f of preferredFruits) if(Math.hypot(f.x-x, f.y-y) < 100) n++;
    return n;
   };
  }else{
   for(let i=0;i<fruitCells.length;i++){
    const cell=fruitCells[i];
    if(prefs.includes(biome[cell])) points.push({x:(cell%GW+.5)*CELL,y:(Math.floor(cell/GW)+.5)*CELL});
   }
   foodScore = (x,y) => {
    let n=0;const cx=x/CELL|0,cy=y/CELL|0;
    for(let yy=Math.max(0,cy-4);yy<=Math.min(GH-1,cy+4);yy++)
     for(let xx=Math.max(0,cx-4);xx<=Math.min(GW-1,cx+4);xx++)
      if(prefs.includes(biome[yy*GW+xx])) n++;
    return n;
   };
  }
 }else if(member.diet === "herbivore"){
  const gp=GRASS_BIOMES.includes(member.grassPref)?member.grassPref:2;
  for(const i of grassCells) if(biome[i]===gp && grass[i] > .1) points.push({x:(i%GW+.5)*CELL,y:(Math.floor(i/GW)+.5)*CELL});
  foodScore = (x,y) => {
   let total=0;const cx=x/CELL|0,cy=y/CELL|0;
   for(let yy=Math.max(0,cy-3);yy<=Math.min(GH-1,cy+3);yy++)
    for(let xx=Math.max(0,cx-3);xx<=Math.min(GW-1,cx+3);xx++) total+=grass[yy*GW+xx];
   return total;
  };
 }else if(member.diet === "scavenger"){
  const meat = corpses.filter(k => k.meat > .5);
  points = meat.map(k => ({x: k.x, y: k.y}));
  foodScore = (x,y) => {
   let n=0;
   for(const k of meat) if(Math.hypot(k.x-x, k.y-y) < 140) n += Math.min(3, k.meat/50);
   return n;
  };
 }else{
  const minSize=member.size*env.huntMin,maxSize=member.size*env.huntMax,maxSpeed=member._huntSpeed;
  const canHuntCarn=!!env.huntCarnivore;
  const prey=pop.filter(o=>!o.dead&&o.h!==member.h&&(canHuntCarn||o.diet!=="carnivore")&&((o.diet===member.carnDietPref&&getCreatureBiome(o)===member.carnBiomePref)||(o.diet==="scavenger"&&env.huntScavenger))&&o.size>=minSize&&o.size<=maxSize&&o.s.speed<=maxSpeed);
  const meat=corpses.filter(k=>k.meat>.5 && ((k.diet===member.carnDietPref && k.biome===member.carnBiomePref)||(k.diet==="scavenger"&&env.eatScavCorpse)));
  points=prey.map(o=>({x:o.x,y:o.y})).concat(meat.map(k=>({x:k.x,y:k.y})));
  foodScore=(x,y)=>{
   let n=0;
   for(const o of prey) if(Math.hypot(o.x-x,o.y-y)<140) n++;
   for(const k of meat) if(Math.hypot(k.x-x,k.y-y)<140) n+=Math.min(3,k.meat/50);
   return n;
  };
 }

 if(!points.length){
  if(member.diet==="carnivore") return bestBiome(member.carnBiomePref);
  return [startX,startY];
 }
 let candidates=points.filter(p=>Math.hypot(p.x-startX,p.y-startY)<=maxNear);
 if(!candidates.length){
  candidates=points.slice().sort((a,b)=>Math.hypot(a.x-startX,a.y-startY)-Math.hypot(b.x-startX,b.y-startY)).slice(0,Math.min(160,points.length));
 }
 if(candidates.length>100){
  const sample=[];
  for(let i=0;i<100;i++) sample.push(candidates[rnd()*candidates.length|0]);
  candidates=sample;
 }
 let best=null,bestScore=-1;
 for(const p of candidates){
  if(cellAt(p.x,p.y)<2) continue;
  if(member.diet==="herbivore" && cellAt(p.x,p.y)!==(GRASS_BIOMES.includes(member.grassPref)?member.grassPref:2)) continue;
  const distance=Math.hypot(p.x-startX,p.y-startY);
  const score=foodScore(p.x,p.y)/(1+distance/Math.max(100,maxNear));
  if(score>bestScore){bestScore=score;best=p;}
 }
 return best?[best.x,best.y]:[startX,startY];
}

function disperseHerd(h, members, leaveCount){
 const shuffled = members.slice().sort(() => rnd() - 0.5);
 const departing = shuffled.slice(0, leaveCount);
 const base = departing[rnd() * departing.length | 0];

 let bestX = 0, bestY = 0;
 for(const c of departing) { bestX += c.x; bestY += c.y; }
 bestX /= departing.length; bestY /= departing.length;

 for(let tryK = 0; tryK < 30; tryK++){
  const ang = rnd() * 6.283;
  const dist = h.rad * (1.1 + rnd() * 0.8);
  const tx = clamp(h.cx + Math.cos(ang) * dist, CELL*2, WW - CELL*2);
  const ty = clamp(h.cy + Math.sin(ang) * dist, CELL*2, WH - CELL*2);
  if(cellAt(tx, ty) >= 2){
   bestX = tx; bestY = ty;
   break;
  }
 }

 [bestX,bestY] = findFoodCenter(base, bestX, bestY, h.rad);
 const newRad = clamp(Math.round((h.rad * (0.8 + rnd() * 0.4) + (rnd() - 0.5) * 20) / 5) * 5, 10, 300);
 const allowedBiomes = base.diet === "herbivore" ? [base.grassPref??base.h.grassPref??2] :
  base.diet === "frugivore" ? (base.fruitPref||base.h.fruitPref||[3]) :
  base.diet === "carnivore" ? [base.carnBiomePref??base.h.carnBiomePref??2] : null;
 [bestX,bestY] = findSeparatedHerdCenter(allowedBiomes,newRad,[bestX,bestY]);
 const vegName = BIOMES[cellAt(bestX, bestY)][0];
 const foodName = base.diet === "carnivore" ? carnPrefName(base.carnBiomePref, base.carnDietPref) : base.diet === "scavenger" ? "死体" : base.diet === "herbivore" ? `${grassPrefName(base.grassPref??base.h.grassPref)}の草` : ((base.fruitPref||[3]).map(b=>BIOMES[b][0]).join("・") + "果実");
 
 let totalSize = 0;
 for(const c of departing) totalSize += c.s.size;
 const avgSize = (totalSize / departing.length).toFixed(1);

 const newName = `${vegName}・${foodName}・${avgSize}`;
 const baseBiome = base.diet === "carnivore" ? (base.carnBiomePref ?? base.h.carnBiomePref ?? 2) : base.diet === "frugivore" ? ((base.fruitPref && base.fruitPref[0]) ?? (base.h.fruitPref && base.h.fruitPref[0]) ?? 3) : (base.grassPref ?? base.h.grassPref ?? 2);
 const newH = addHerd(newName, { ...base.s, size: +avgSize }, baseBiome, base.diet);
 newH.cx = bestX; newH.cy = bestY;
 newH.rad = newRad;
 newH.hungry = h.hungry;
 newH.birthAt = h.birthAt; newH.birthCost = h.birthCost;
 newH.hmul = h.hmul;
 newH.diet = base.diet;
 newH.fruitPref = [...(base.fruitPref || [3])];
 newH.grassPref = base.grassPref??base.h.grassPref??2;
 newH.carnBiomePref = base.carnBiomePref??base.h.carnBiomePref??2;
 newH.carnDietPref = base.carnDietPref??base.h.carnDietPref??"herbivore";

 for(const c of departing) {
  c.h = newH;
  c.gen = 1;
  c.mode = 0;
  c.tgt = null;
  c.wa = Math.atan2(bestY - c.y, bestX - c.x);
  birthFx(c.x, c.y);
 }
 sfx("birth");
 toast(`🕊️ ${departing.length}匹が巣立ち、新群れ「${newH.name}」を結成！`);
 renderPanel();
}

const snd={hit:true,birth:true,ext:true};

function determineChildDiet(a, b){
 let d = rnd() < 0.5 ? a.diet : b.diet;
 if(!DIETN[d]) d = "herbivore";
 let mutated = false;
 if(rnd() < (env.dietMut ?? 0.01)){
  const others = Object.keys(DIETN).filter(k => k !== d && (env.enableScavenger || k !== "scavenger"));
  if (others.length > 0) {
    d = others[rnd() * others.length | 0];
    toast(`🧬 突然変異！ 【${DIETN[d]}】への変異が発生しました！`);
    sfx("birth");
    mutated = true;
  }
 }
 return {d, mutated};
}

function determineChildFruitPref(a, b){
 const pA = Array.isArray(a.fruitPref) && a.fruitPref.length ? a.fruitPref : [3];
 const pB = Array.isArray(b.fruitPref) && b.fruitPref.length ? b.fruitPref : [3];
 let pref = rnd() < 0.5 ? [...pA] : [...pB];
 const validFruitBiomes = BIOMES.map((bm, idx) => bm[2] > 0 ? idx : -1).filter(idx => idx >= 0);
 let mutated = false;
 if(rnd() < (env.fruitMut ?? 0.01)){
  const cur = pref[0] ?? 3;
  const others = validFruitBiomes.filter(bmId => bmId !== cur);
  if(others.length > 0){
   const nextB = others[rnd() * others.length | 0];
   pref = [nextB];
   toast(`🍎 果物の好みが突然変異！【${BIOMES[nextB][0]}の果実】を好む性質に変異！`);
   sfx("birth");
   mutated = true;
  }
 }
 return {pref, mutated};
}

function determineChildGrassPref(a,b){
 let pref=rnd()<0.5?(a.grassPref??a.h.grassPref):(b.grassPref??b.h.grassPref);
 if(!GRASS_BIOMES.includes(pref))pref=2;
 let mutated = false;
 if(rnd()<(env.fruitMut??0.01)){
  const others=GRASS_BIOMES.filter(id=>id!==pref);
  if (others.length > 0) {
    pref=others[rnd()*others.length|0];
    toast(`🌿 草の好みが突然変異！【${grassPrefName(pref)}】を好む性質に変異！`);
    sfx("birth");
    mutated = true;
  }
 }
 return {pref, mutated};
}

function determineChildCarnPref(a, b, isDietMutatedToCarn){
 let bPref = rnd()<0.5 ? (a.carnBiomePref??a.h.carnBiomePref??2) : (b.carnBiomePref??b.h.carnBiomePref??2);
 let dPref = rnd()<0.5 ? (a.carnDietPref??a.h.carnDietPref??"herbivore") : (b.carnDietPref??b.h.carnDietPref??"herbivore");
 let mutated = false;
 if(isDietMutatedToCarn){
  const pick = CARN_PREFS[rnd()*CARN_PREFS.length|0];
  bPref = pick.b; dPref = pick.d;
  mutated = true;
 } else if(rnd() < (env.fruitMut ?? 0.01)){
  const pick = CARN_PREFS[rnd()*CARN_PREFS.length|0];
  bPref = pick.b; dPref = pick.d;
  toast(`🥩 狩りの好みが突然変異！【${carnPrefName(bPref, dPref)}】を好む肉食獣が誕生！`);
  sfx("birth");
  mutated = true;
 }
 return {bPref, dPref, mutated};
}

function determineChildPersonality(a, b, diet){
 let p = rnd() < 0.5 ? (a.personality||"solitary") : (b.personality||"solitary");
 if(!env.enablePersonality) return {personality:"solitary", mutated:false};
 let mutated = false;
 if(rnd() < (env.personalityMut ?? 0.05)){
  const opts = ["solitary", "social", "sharing"];
  const others = opts.filter(x => x !== p);
  if(others.length > 0){
   p = others[rnd() * others.length | 0];
   mutated = true;
   toast(`🧠 性格が突然変異！【${P_NAME[p]}】に変異！双子が別々の群れで誕生します`);
   sfx("birth");
  }
 }
 return {personality:p, mutated};
}

function createMutantHerd(a, b, diet, fruitPref, grassPref, carnBiomePref, carnDietPref){
  const avgSize = ((a.s.size + b.s.size)/2).toFixed(1);
  const newRad = clamp(Math.round((a.h.rad * (0.8 + rnd() * 0.4) + (rnd() - 0.5) * 20) / 5) * 5, 10, 300);
  const allowedBiomes = diet === "herbivore" ? [grassPref] :
    diet === "frugivore" ? fruitPref :
    diet === "carnivore" ? [carnBiomePref] : null;
  const [newCx,newCy] = findSeparatedHerdCenter(allowedBiomes,newRad,null);

  const dietName = DIETN[diet] ? DIETN[diet].replace("動物","") : "不明";
  let bId = cellAt(newCx, newCy);
  if (diet === "herbivore") bId = grassPref;
  else if (diet === "frugivore") bId = fruitPref[0] ?? 3;
  else if (diet === "carnivore") bId = carnBiomePref;
  const biomeName = BIOMES[bId] ? BIOMES[bId][0] : "不明";
  let newName = `${dietName}・${biomeName}・${avgSize}`;
  if (diet === "carnivore") {
    const prefBName = BIOMES[carnBiomePref] ? BIOMES[carnBiomePref][0] : "";
    const prefDName = DIETN[carnDietPref] ? DIETN[carnDietPref].slice(0, 2) : "";
    newName += `(${prefBName}${prefDName})`;
  }
  const newH = addHerd(newName, { ...a.s, size: +avgSize }, bId, diet);
  newH.cx = newCx; newH.cy = newCy;
  newH.rad = newRad;
  newH.hungry = a.h.hungry; newH.birthAt = a.h.birthAt; newH.birthCost = a.h.birthCost; newH.hmul = a.h.hmul;
  newH.diet = diet; newH.fruitPref = [...fruitPref]; newH.grassPref = grassPref; newH.carnBiomePref = carnBiomePref; newH.carnDietPref = carnDietPref;
  return newH;
}

function mate(a,b,born){
 const dRes = determineChildDiet(a, b);
 const fRes = determineChildFruitPref(a, b);
 const gRes = determineChildGrassPref(a, b);
 const childDiet = dRes.d;
 const childFruitPref = fRes.pref;
 const childGrassPref = gRes.pref;
 const isDietToCarn = dRes.mutated && childDiet === "carnivore";
 const cRes = determineChildCarnPref(a, b, isDietToCarn);
 const childCarnBiomePref = cRes.bPref;
 const childCarnDietPref = cRes.dPref;
 const pRes = determineChildPersonality(a, b, childDiet);
 const childPersonality = pRes.personality;
 const isMutated = dRes.mutated || fRes.mutated || gRes.mutated || cRes.mutated || pRes.mutated;

 for(const p of[a,b]){p.hun=Math.max(1,p.hun-p.h.birthCost*maxH(p));p.cdT=p.s.cd*(p.s.size/REF_SIZE)*env.cdm;}
 if(pop.length+born.length>=env.maxpop)return;

 let targetHerd = a.h;
 const parentLitter = rnd() < 0.5 ? a.s.litterSize : b.s.litterSize;
 let litter = pRes.mutated ? 2 : Math.round(parentLitter);
 let targetHerds = [];

 if(pRes.mutated){
  for(let i=0;i<2;i++){
   const twinHerd = createMutantHerd(a,b,childDiet,childFruitPref,childGrassPref,childCarnBiomePref,childCarnDietPref);
   twinHerd.name += `・性格変異${i+1}`;
   targetHerds.push(twinHerd);
  }
 } else if(isMutated){
  targetHerd = createMutantHerd(a,b,childDiet,childFruitPref,childGrassPref,childCarnBiomePref,childCarnDietPref);
  targetHerds = Array(litter).fill(targetHerd);
 } else {
  if(herdCountInRange(targetHerd,born)>=env.herdCap)return;
  targetHerds = Array(litter).fill(targetHerd);
 }

 const initialRatio = 1.1 - litter * 0.1;
 for(let i=0; i<litter; i++){
  if(pop.length+born.length>=env.maxpop)break;
  const destinationHerd = targetHerds[i] || targetHerd;
  if(!pRes.mutated && herdCountInRange(destinationHerd,born)>=env.herdCap)break;
  const cs={};for(const k in SR){
    if(k==="litterSize") continue;
    const[lo,hi]=SR[k];
    cs[k]=clamp((a.s[k]+b.s[k])/2+(rnd()-.5)*2*env.mut*(hi-lo)*.5,lo,hi);
  }
  cs.size=clamp(cs.size,env.sizeMin,env.sizeMax);
  let baseLitterSize = rnd() < 0.5 ? a.s.litterSize : b.s.litterSize;
  let mutLitter = Math.floor(rnd() * 3) - 1;
  cs.litterSize = clamp(baseLitterSize + mutLitter, 1, 10);
  let x, y;
  if(isMutated){
   x = destinationHerd.cx + (rnd()-.5)*20;
   y = destinationHerd.cy + (rnd()-.5)*20;
  } else {
   x = (a.x+b.x)/2+(rnd()-.5)*12;
   y = (a.y+b.y)/2+(rnd()-.5)*12;
  }
  const k=mk(destinationHerd,x,y,cs,null,childDiet,childFruitPref,childGrassPref,true,0,
    childCarnBiomePref,childCarnDietPref,initialRatio,childPersonality);
  k.gen=isMutated ? 1 : Math.max(a.gen,b.gen)+1;
  born.push(k);
 }
 if(isMutated){
  for(const h of targetHerds)birthFx(h.cx,h.cy);
 } else {
  birthFx((a.x+b.x)/2,(a.y+b.y)/2);
 }
}

function updateFx(dt){let j=0;for(const e of fx){e.t+=dt;if(e.t<e.life)fx[j++]=e}fx.length=j}
function step(dt){
 T+=dt;updateFruits(dt);updateGrass(dt);updateCorpses(dt);updateFx(dt);checkBudding(dt);const born=[];
 buildGrids();

 herdMembers.clear();
 for (const h of herds) {
   if (h.huntCd > 0) h.huntCd = Math.max(0, h.huntCd - dt);
   herdMembers.set(h.id, []);
 }
 for (const c of pop) {
   if (!c.dead) {
     const list = herdMembers.get(c.h.id);
     if (list) list.push(c);
   }
 }
 for (const h of herds) {
   const members = herdMembers.get(h.id) || [];
   let leader = null, hasHungry = false;
   for (const m of members) {
     if (m.isLeader) leader = m;
     if (m.hun <= maxH(m) * 0.2) hasHungry = true;
   }
   if (members.length > 0 && (!leader || leader.dead)) {
     if (leader) leader.isLeader = false;
     leader = members[0];
     leader.isLeader = true;
   }
   h.leader = leader;
   h.hasHungryMember = hasHungry;
 }

 for(const c of pop)if(!c.dead)updateCreature(c,dt,born);
 for(const c of pop)if(c.dead && c.leaveCorpse)spawnCorpse(c);
 pop=pop.filter(c=>!c.dead).concat(born);
 
 if(selC&&selC.dead)selC=pop.find(c=>c.h===selC.h)||null;
}

function updateRender(){

 for(const c of pop){
  if(a>0&&c.px0!==undefined){

   if(dx*dx+dy*dy<900){c.rx=c.px0+dx*a;c.ry=c.py0+dy*a;continue}
  }
  c.rx=c.x;c.ry=c.y;
 }
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=BIOMES[0][1];ctx.fillRect(0,0,cw,ch);clampCam();
 ctx.setTransform(dpr*z,0,0,dpr*z,dpr*ox,dpr*oy);ctx.drawImage(mapCv,0,0);
 ctx.imageSmoothingEnabled=false;ctx.drawImage(grassCv,0,0,WW,WH);ctx.imageSmoothingEnabled=true;

 for(const f of fruits){ctx.fillStyle=BIOMES[f.b][4];ctx.beginPath();ctx.arc(f.x|0,f.y|0,3,0,6.283);ctx.fill()}
 for(const k of corpses){
  const r=k.size*Math.max(.2,Math.sqrt(k.meat/k.meat0));
  ctx.strokeStyle="rgba(0,0,0,.45)";ctx.lineWidth=1.2/z;
  ctx.fillStyle=k.pale;ctx.beginPath();ctx.arc(k.x|0,k.y|0,r,0,6.283);ctx.fill();
  if(z >= 0.8) ctx.stroke();
  const er=Math.min(r*.4,Math.max(1,r*(.14+.3*(k.vis-30)/220)*1.1));
  if(z >= 0.8) {
   ctx.strokeStyle="#222";ctx.lineWidth=1.3/z;
   for(const sd of[-1,1]){const ea=k.ang+sd*.7,ex=k.x+Math.cos(ea)*r*.62,ey=k.y+Math.sin(ea)*r*.62;
    ctx.beginPath();ctx.moveTo((ex-er)|0,(ey-er)|0);ctx.lineTo((ex+er)|0,(ey+er)|0);ctx.moveTo((ex+er)|0,(ey-er)|0);ctx.lineTo((ex-er)|0,(ey+er)|0);ctx.stroke()}
  }
 }
 for(const h of herds){
  ctx.strokeStyle=h.color;ctx.lineWidth=(h===sel?3:1.5)/z;ctx.setLineDash([6/z,4/z]);
  ctx.beginPath();ctx.arc(h.cx|0,h.cy|0,12,0,6.283);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha=h===sel?.7:.25;ctx.setLineDash([10/z,8/z]);ctx.beginPath();ctx.arc(h.cx|0,h.cy|0,h.rad,0,6.283);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
 }
 ctx.strokeStyle="#808080";ctx.lineWidth=1.2/z;
 for(const c of pop){
  const r=c.size,a=c.ang;let px=c.rx??c.x,py=c.ry??c.y;
  if(c.lunge>0){const k=Math.sin(c.lunge/.25*Math.PI)*r*.7;px+=Math.cos(c.la)*k;py+=Math.sin(c.la)*k}
  
  ctx.fillStyle=c.h.color;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
  if (z >= 0.8) ctx.stroke();

  if (z >= 0.8) {
   const eyeR = r * clamp(.14 + .3 * (c.s.vision - 30) / 220, .14, .26);
   const pupilR = eyeR * .52;
   const pupilColor = c.diet === "scavenger" ? "#2ecc71" : (c.diet === "carnivore" ? "#d63031" : "#111");
   for(const sd of[-1,1]){
    const ea=a+sd*.7,ex=px+Math.cos(ea)*r*.62,ey=py+Math.sin(ea)*r*.62;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,eyeR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=pupilColor;
    ctx.beginPath();ctx.arc(ex+Math.cos(a)*eyeR*.28,ey+Math.sin(a)*eyeR*.28,pupilR,0,Math.PI*2);ctx.fill();
   }
  }
 }
 for(const e of fx){const k=e.t/e.life;ctx.globalAlpha=1-k;
  if(e.type==="p"){ctx.fillStyle=e.col;ctx.beginPath();ctx.arc((e.x+e.vx*e.t)|0,(e.y+e.vy*e.t)|0,e.r*(1-k*.5),0,6.283);ctx.fill()}
  else if(e.type==="h"){ctx.font=(e.r*3)+"px sans-serif";ctx.textAlign="center";ctx.fillStyle=e.col;ctx.fillText("♥",(e.x+e.vx*e.t)|0,(e.y+e.vy*e.t)|0)}
  else{ctx.strokeStyle=e.col;ctx.lineWidth=e.w/z;ctx.beginPath();ctx.arc(e.x|0,e.y|0,e.r+e.grow*k,0,6.283);ctx.stroke()}
 }
 ctx.globalAlpha=1;
 if(selC){const sx=selC.rx??selC.x,sy=selC.ry??selC.y;
  ctx.strokeStyle="#fff";ctx.lineWidth=2/z;ctx.beginPath();ctx.arc(sx,sy,selC.size+4,0,6.283);ctx.stroke();
  ctx.setLineDash([4/z,4/z]);ctx.beginPath();ctx.arc(sx,sy,selC.s.vision,0,6.283);ctx.stroke();ctx.setLineDash([])}
}

function clampCam(){
  if(WW*z<=cw)ox=(cw-WW*z)/2;else ox=clamp(ox,cw-WW*z,0);
  if(WH*z<=ch)oy=(ch-WH*z)/2;else oy=clamp(oy,ch-WH*z,0);
}
function fit(){z=Math.min(cw/WW,ch/WH)||1;ox=(cw-WW*z)/2;oy=(ch-WH*z)/2;clampCam()}
function zoomAt(sx,sy,k){const nz=clamp(z*k,.3,6);k=nz/z;ox=sx-(sx-ox)*k;oy=sy-(sy-oy)*k;z=nz;clampCam()}
function updateCamera(){
  if(selC && !selC.dead && ptr.size === 0){
    const tx = cw / 2 - (selC.rx ?? selC.x) * z;
    const ty = ch / 2 - (selC.ry ?? selC.y) * z;
    ox += (tx - ox) * 0.15;
    oy += (ty - oy) * 0.15;
    clampCam();
  }
}

const ptr=new Map();let moved=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.offsetX,y:e.offsetY});moved=0});
cv.addEventListener("pointermove",e=>{
 const p=ptr.get(e.pointerId);if(!p)return;const nx=e.offsetX,ny=e.offsetY;
 if(ptr.size===1){ox+=nx-p.x;oy+=ny-p.y;clampCam();moved+=Math.abs(nx-p.x)+Math.abs(ny-p.y)}
 else if(ptr.size===2){const q=[...ptr.entries()].find(([id])=>id!==e.pointerId)[1];
  const d0=Math.hypot(p.x-q.x,p.y-q.y)||1,d1=Math.hypot(nx-q.x,ny-q.y);zoomAt((nx+q.x)/2,(ny+q.y)/2,d1/d0);moved=99}
 p.x=nx;p.y=ny});

cv.addEventListener("pointerup",e=>{
 if(ptr.size===1 && moved>12 && selC){selC=null;updateCounts()}else if(ptr.size===1 && moved<6){tap(e.offsetX,e.offsetY)}
 ptr.delete(e.pointerId);
});
cv.addEventListener("pointercancel",e=>ptr.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.15:1/1.15)},{passive:false});

function tap(sx,sy){
 const wx=(sx-ox)/z,wy=(sy-oy)/z;
 if(placing&&sel){sel.cx=clamp(wx,0,WW-1);sel.cy=clamp(wy,0,WH-1);placing=false;toast("群れの中心を移動しました");return}
 let best=null,bd=1e9;for(const c of pop){const d=Math.hypot(c.x-wx,c.y-wy)-c.size;if(d<bd){bd=d;best=c}}
 selC=bd<14/z?best:null;
 if(selC){sel=selC.h;renderPanel()}
 updateCounts();
}

}
function updateCounts(){
 const cnt={},gm={};let herbivoreCount=0,frugivoreCount=0,carnivoreCount=0,scavengerCount=0;let totalPop=0;
 const ds={
  herbivore:{n:0,size:0,vision:0,speed:0,maxGen:0,litterSize:0},
  frugivore:{n:0,size:0,vision:0,speed:0,maxGen:0,litterSize:0},
  scavenger:{n:0,size:0,vision:0,speed:0,maxGen:0,litterSize:0},
  carnivore:{n:0,size:0,vision:0,speed:0,maxGen:0,litterSize:0}
 };
 for(const c of pop){
  if(c.dead) continue;
  const q=ds[c.diet];
  if(q){
   q.n++;
   q.size+=c.s.size;
   q.vision+=c.s.vision;
   q.speed+=c.s.speed;
   if(c.gen > q.maxGen) q.maxGen = c.gen;
   q.litterSize+=(c.s.litterSize||1);
  }
  cnt[c.h.id]=(cnt[c.h.id]||0)+1;gm[c.h.id]=Math.max(gm[c.h.id]||0,c.gen);
  if(c.diet==="herbivore")herbivoreCount++;
  else if(c.diet==="frugivore")frugivoreCount++;
  else if(c.diet==="scavenger")scavengerCount++;
  else if(c.diet==="carnivore")carnivoreCount++;
  if(c.size > maxObservedSize) maxObservedSize = c.size;
  totalPop++;
 }
 let needReRender = false;
 const herdStats = herds.map(g => ({ g, count: cnt[g.id] || 0 }));
 herdStats.sort((a, b) => b.count - a.count || a.g.id - b.g.id);
 for(let i=0; i<herdStats.length; i++){
  const stat = herdStats[i];const g = stat.g;
  if(cnt[g.id]){g.had=true;g.lastGen=gm[g.id]}
  else if(g.had){g.had=false;sfx("ext");toast(g.name+"が絶滅しました（最大"+(g.lastGen||1)+"世代）");}
  const pct = totalPop > 0 ? (stat.count / totalPop * 100).toFixed(1) : 0;
  const row = $("herdRow" + g.id);
  if(row){row.style.order = i;row.style.background = `linear-gradient(to right, ${g.color}44 ${pct}%, transparent ${pct}%)`;}
  const e=$("n"+g.id);
  if(e){e.textContent = stat.count ? `${pct}% (${stat.count}匹) 最大${gm[g.id]}世代` : `絶滅${g.lastGen?"（最大"+g.lastGen+"世代）":""}`;}
 }
 if(env.autoDelExtinct){
  const extinctList = herds.filter(g => g.had===false && !cnt[g.id]);
  if(extinctList.length > 0){
   herds = herds.filter(g => !extinctList.includes(g));
   if(extinctList.includes(sel)) sel = herds[0] || null;
   needReRender = true;
  }
 }
 if(needReRender) renderPanel();

 $("dayStat").textContent=`${Math.floor(T/DAY)+1}日目`;
 $("allCount").textContent=pop.length.toLocaleString("ja-JP");
 $("maxSize").textContent=maxObservedSize.toFixed(1);
 $("corpseCount").textContent=corpses.length.toLocaleString("ja-JP");
 $("carnivoreCount").textContent=carnivoreCount.toLocaleString("ja-JP");
 $("scavengerCount").textContent=scavengerCount.toLocaleString("ja-JP");
 $("frugivoreCount").textContent=frugivoreCount.toLocaleString("ja-JP");
 $("herbivoreCount").textContent=herbivoreCount.toLocaleString("ja-JP");
 if(!$("detailBox").hidden)renderDetail(ds);

 const tDiet = herbivoreCount + frugivoreCount + scavengerCount + carnivoreCount;
 if(tDiet > 0){
  $("barHerb").style.width = (herbivoreCount / tDiet * 100) + "%";
  $("barFrug").style.width = (frugivoreCount / tDiet * 100) + "%";
  $("barScav").style.width = (scavengerCount / tDiet * 100) + "%";
  $("barCarn").style.width = (carnivoreCount / tDiet * 100) + "%";
 } else {
  $("barHerb").style.width = "0%";$("barFrug").style.width = "0%";$("barScav").style.width = "0%";$("barCarn").style.width = "0%";
 }

 const i=$("info");
 if(i){
  if(selC){
   const prefBName = BIOMES[selC.fruitPref?.[0] ?? 3]?.[0] || "";
   const prefTxt = selC.diet==="frugivore" ? ` (果物:${prefBName})` : selC.diet==="herbivore" ? ` (草:${grassPrefName(selC.grassPref??selC.h.grassPref)})` : selC.diet==="carnivore" ? ` (獲物:${carnPrefName(selC.carnBiomePref??selC.h.carnBiomePref, selC.carnDietPref??selC.h.carnDietPref)})` : "";
   const huntCdTxt = selC.diet==="carnivore" && selC.huntCd>0 ? ` [CT:${selC.huntCd.toFixed(1)}s]` : "";
   const herdHuntCdTxt = selC.diet==="carnivore" && selC.h.huntCd>0 ? ` [群れCT:${selC.h.huntCd.toFixed(1)}s]` : "";
   const lTxt = selC.isLeader && env.enablePersonality && (selC.personality==="social"||selC.personality==="sharing") ? " 👑リーダー" : "";
   const pTxt = env.enablePersonality ? ` 性格:${P_NAME[selC.personality]||"孤立"}` : "";
   i.textContent=`🎯追尾中: ${selC.h.name}${lTxt} 【${DIETN[selC.diet]||"草食動物"}】${prefTxt}${pTxt} (${selC.gen}代) 群れの生物数${livingHerdCount(selC.h)}匹 サイズ${selC.size.toFixed(1)}(最大${selC.s.size.toFixed(1)}) 視認距離${selC.s.vision|0} 年齢${(selC.age/DAY).toFixed(1)}/${lifespanDays(selC).toFixed(0)}日 速度${selC.s.speed|0} 空腹${selC.hun|0}/${maxH(selC)|0} 出産数${selC.s.litterSize}${huntCdTxt}${herdHuntCdTxt}`;
  } else {
   i.textContent="追尾中の生物はいません（地図上の生物をタップすると追尾します）";
  }
 }
}

function save(n){
 try{
  const d={ver:3,hadSaved:true,seed,T,env,mapScale:worldScale,maxObservedSize,herds:herds.map(({id,name,color,cx,cy,st,rad,hungry,birthAt,birthCost,hmul,diet,fruitPref,grassPref,carnBiomePref,carnDietPref,huntCd,had,lastGen})=>({id,name,color,cx,cy,st,rad,hungry,birthAt,birthCost,hmul,had,lastGen,huntCd:huntCd||0,diet:diet||"herbivore",fruitPref:Array.isArray(fruitPref)?fruitPref:[fruitPref??3],grassPref:GRASS_BIOMES.includes(grassPref)?grassPref:2,carnBiomePref:carnBiomePref||2,carnDietPref:carnDietPref||"herbivore"})),
   pop:pop.map(c=>({x:c.x,y:c.y,ang:c.ang,h:c.h.id,s:c.s,size:c.size,hun:c.hun,cdT:c.cdT,age:c.age,gen:c.gen,huntCd:c.huntCd||0,diet:c.diet,fruitPref:c.fruitPref,grassPref:c.grassPref,carnBiomePref:c.carnBiomePref||2,carnDietPref:c.carnDietPref||"herbivore", personality:c.personality||"solitary", isLeader:c.isLeader||false})),fruits:fruits.map(f=>({x:f.x,y:f.y,b:f.b,life:f.life})),grass:Array.from(grass,v=>+v.toFixed(1)),corpses:corpses.map(k=>({...k}))};
  localStorage.setItem("evo_save_"+n,JSON.stringify(d));
  localStorage.setItem("evo_meta_"+n,new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}));
  toast("枠"+n+"にセーブしました");renderPanel();
 }catch(err){toast("セーブに失敗しました")}
}
function load(n){
 try{
  const raw=localStorage.getItem("evo_save_"+n);if(!raw){toast("枠"+n+"は空です");return}
  const d=JSON.parse(raw);mapScale=[1,2,4].includes(d.mapScale)?d.mapScale:1;genWorld(d.seed);T=d.T;maxObservedSize=d.maxObservedSize||0;
  if(d.env){
   const DEF_M={maxHBase:60,metabBase:0.35,moveCost:0.6,senseCost:0.2,preyEBase:80,massExp:1.0,bmrExp:0.75,moveMassExp:1.0,moveSpeedExp:2.0,huntSizeBonus:0.015,herdCap:20,budding:false,buddingRate:0.10,dietMut:0.05,fruitMut:0.05,autoDelExtinct:true,enableScavenger:false,huntHerdCd:0,huntLeaveCorpse:false,enablePersonality:false,personalityMut:0.05,colorSat:80,colorLit:50,...ENV_NEW};
   env=Object.assign({},DEF_M,d.env);delete env.maxHExp;delete env.sizeMetabExp;delete env.preyExp;
  }
  if(!Number.isFinite(env.huntHerdMin))env.huntHerdMin=0;
  if(!Number.isFinite(env.grassExtreme))env.grassExtreme=1.5;
  if(!Number.isFinite(env.fruitExtreme))env.fruitExtreme=1.5;
  if(!Number.isFinite(env.huntSuccess))env.huntSuccess=100;
  if(!Number.isFinite(env.huntNut))env.huntNut=0.5;
  if(!Number.isFinite(env.huntCd))env.huntCd=0;
  if(env.huntCarnivore===undefined)env.huntCarnivore=false;
  if(!Number.isFinite(env.growthRate))env.growthRate=1.0;
  if(!Number.isFinite(env.childHmul))env.childHmul=2;
  if(!Number.isFinite(env.huntHerdCd))env.huntHerdCd=0;
  if(env.huntLeaveCorpse===undefined)env.huntLeaveCorpse=false;
  if(env.enablePersonality===undefined)env.enablePersonality=false;
  if(!Number.isFinite(env.personalityMut))env.personalityMut=0.05;
  if(Number.isFinite(d.env?.minprey)){env.huntMin = d.env.minprey;env.huntMax = d.env.huntRatio ? +(1/d.env.huntRatio).toFixed(2) : 0.5;delete env.minprey; delete env.huntRatio;}
  if(!Number.isFinite(env.huntMin))env.huntMin=0.4;
  if(!Number.isFinite(env.huntMax))env.huntMax=0.8;
  fc=BIOMES.map(()=>0);
  herds=d.herds.map(g=>{const h={rad:DEF_RAD,hungry:HUNGRY,birthAt:BIRTH_AT,birthCost:BIRTH_COST,hmul:1,diet:"herbivore",fruitPref:[3],carnBiomePref:2,carnDietPref:"herbivore",huntCd:0,...g};if(!GRASS_BIOMES.includes(h.grassPref))h.grassPref=GRASS_BIOMES.includes(cellAt(h.cx,h.cy))?cellAt(h.cx,h.cy):2;if(!d.ver&&h.diet==="herbivore")h.diet="frugivore"; h.fruitPref=Array.isArray(h.fruitPref)?h.fruitPref:[h.fruitPref??3];return h});
  pop=[];fx=[];
  for(const o of d.pop){
    const h=herds.find(g=>g.id===o.h);
    if(h){
      if(!o.s.litterSize) o.s.litterSize = 1;
      const cRatio = o.size ? o.size / o.s.size : 1;
      const c=mk(h,o.x,o.y,o.s,o.hun,(!d.ver&&o.diet==="herbivore")?"frugivore":o.diet,o.fruitPref,GRASS_BIOMES.includes(o.grassPref)?o.grassPref:h.grassPref,false,o.huntCd||0,o.carnBiomePref??h.carnBiomePref??2,o.carnDietPref??h.carnDietPref??"herbivore", cRatio, o.personality||"solitary");
      if(o.isLeader) c.isLeader = true;
      c.ang=o.ang;c.cdT=o.cdT;c.age=Number.isFinite(o.age)?o.age:0;c.gen=o.gen||1;
    }
  }
  if(!d.hadSaved)for(const h of herds)if(h.had===undefined)h.had=pop.some(c=>c.h===h);
  fruits=d.fruits;for(const f of fruits)fc[f.b]++;
  if(d.grass&&d.grass.length===GW*GH){for(let i=0;i<GW*GH;i++)grass[i]=d.grass[i]}
  corpses=(Array.isArray(d.corpses)?d.corpses:[]).map(k=>({diet:"herbivore",biome:2,...k}));
  renderGrass();
  sel=herds[0]||null;selC=null;
  invalidateCaches();
  renderPanel();toast("枠"+n+"をロードしました");
 }catch(err){toast("ロードに失敗しました")}
}

panel.addEventListener("input",applyChg);panel.addEventListener("change",applyChg);
document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll("[data-sp]").forEach(x=>x.classList.toggle("on",x===b))});
$("fit").onclick=()=>{selC=null;fit()};
$("tg").onclick=()=>panel.classList.toggle("hide");
let last=0,acc=0,uAcc=0,gR=0;
function loop(t){
 const dt=Math.min(.1,(t-last)/1000||0);last=t;
 if(speed>0){acc+=dt*speed;let n=0;while(acc>=STEP&&n<80){for(const c of pop){c.px0=c.x;c.py0=c.y}step(STEP);acc-=STEP;n++}if(n>=80)acc=0}
 updateRender();
 updateCamera();
 draw();
 uAcc+=dt;if(uAcc>.5){uAcc=0;updateCounts()}
 gR+=dt;if(gR>.3){gR=0;renderGrass()}
 requestAnimationFrame(loop);
}

const trackRandom = (diet) => {
  const list = pop.filter(c => c.diet === diet && !c.dead);
  if(list.length > 0){selC = list[rnd()*list.length|0];sel = selC.h;renderPanel();updateCounts();}
};
(()=>{
 const box=$("detailBox");let dragging=false,pointerId=null,startX=0,startY=0,baseLeft=0,baseTop=0;
 document.body.appendChild(box);
 box.addEventListener("pointerdown",e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const r=box.getBoundingClientRect();
  dragging=true;pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;
  baseLeft=r.left;baseTop=r.top;
  box.style.left=baseLeft+"px";box.style.top=baseTop+"px";box.style.right="auto";
  box.classList.add("dragging");box.setPointerCapture(pointerId);e.preventDefault();
 });
 box.addEventListener("pointermove",e=>{
  if(!dragging||e.pointerId!==pointerId)return;
  const maxLeft=Math.max(0,window.innerWidth-box.offsetWidth),maxTop=Math.max(0,window.innerHeight-box.offsetHeight);
  box.style.left=clamp(baseLeft+e.clientX-startX,0,maxLeft)+"px";
  box.style.top=clamp(baseTop+e.clientY-startY,0,maxTop)+"px";
 });
 const stop=e=>{if(!dragging||e.pointerId!==pointerId)return;dragging=false;pointerId=null;box.classList.remove("dragging")};
 box.addEventListener("pointerup",stop);box.addEventListener("pointercancel",stop);
 window.addEventListener("resize",()=>{
  if(box.hidden)return;
  const r=box.getBoundingClientRect();
  box.style.left=clamp(r.left,0,Math.max(0,window.innerWidth-box.offsetWidth))+"px";
  box.style.top=clamp(r.top,0,Math.max(0,window.innerHeight-box.offsetHeight))+"px";
 });
})();
$("mDetail").onclick = () => {const b=$("detailBox");b.hidden=!b.hidden;$("detailArrow").textContent=b.hidden?"▼":"▲";updateCounts();};
$("mHerb").onclick = () => trackRandom("herbivore");
$("mFrug").onclick = () => trackRandom("frugivore");
$("mScav").onclick = () => trackRandom("scavenger");
$("mCarn").onclick = () => trackRandom("carnivore");

resize();newWorld(rnd()*1e6|0);requestAnimationFrame(loop);

if ("serviceWorker" in navigator && window.isSecureContext) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloadingForUpdate = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloadingForUpdate && performance.now() < 15000) {
      reloadingForUpdate = true;
      location.reload();
    }
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {
      scope: "./",
      updateViaCache: "none"
    }).then(registration => {
      registration.update().catch(() => {});
    }).catch(() => {});
  }, { once: true });
}
